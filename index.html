<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181b"><title>BikeGuard</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BikeGuard"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#fff;--ink:#14181b;--card:#f1f3ee;--ac:#ffd400;--bad:#d62828;--ok:#0a7d4f}
body.night{--bg:#14181b;--ink:#f4f4ef;--card:#232a2f}
*{box-sizing:border-box}html,body{height:100%;margin:0;font:600 17px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#map{position:fixed;inset:0;z-index:0}
.top{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--card);color:var(--ink);border-radius:20px;padding:5px 11px;font-size:14px}
.pill.ok{background:var(--ok);color:#fff}.pill.bad{background:var(--bad);color:#fff}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);padding:12px 12px calc(env(safe-area-inset-bottom) + 12px);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px #0004;max-height:65vh;overflow:auto}
button{font:inherit;border:0;border-radius:14px;padding:16px;background:var(--card);color:var(--ink);width:100%;min-height:56px}
button.main{background:var(--ac);color:#14181b;font-weight:800;font-size:22px;min-height:76px}
button.stop{background:var(--bad);color:#fff}
#bCenter{position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 96px);z-index:5;width:56px;height:56px;padding:0;border-radius:50%;background:var(--ac);color:#14181b;font-size:30px;box-shadow:0 2px 10px #0006}
.me{width:38px;height:38px;border-radius:50%;background:var(--ac);border:3px solid #14181b;display:flex;align-items:center;justify-content:center;font-size:22px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
#hud{display:none}.riding #hud{display:block}.riding #home{display:none}
#maneuver{font-size:26px;font-weight:800}#eta{font-size:14px;opacity:.8;margin-top:4px}
#warn{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 52px);z-index:6;background:var(--bad);color:#fff;border-radius:16px;padding:16px;font-size:24px;font-weight:800;text-align:center;display:none}
#cam{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 48px);width:30vw;max-width:150px;border-radius:12px;z-index:4;display:none;background:#000}
.riding #cam{display:block}
.item{background:var(--card);border-radius:14px;padding:12px;margin-top:8px}.item small{display:block;font-weight:500;opacity:.8}
label{display:block;margin-top:12px}select,input[type=range]{width:100%;font:inherit;padding:8px}
dialog{border:0;border-radius:18px;background:var(--bg);color:var(--ink);width:92vw;max-height:85vh}
</style></head><body>
<div id="map"></div>
<div class="top"><span class="pill" id="sGps">GPS: —</span><span class="pill" id="sCam">Kamera: —</span><span class="pill" id="sAi">Ostrzeganie: —</span><span class="pill" id="sMute">🔊</span></div>
<button id="bCenter" aria-label="Wyśrodkuj mapę">◎</button>
<div id="warn"></div><video id="cam" playsinline muted autoplay></video>

<div class="panel" id="home">
  <button class="main" id="bStart">ROZPOCZNIJ JAZDĘ</button>
  <label style="margin-top:10px">Rodzaj drogi<select id="prof"><option value="bike">🚲 Rowerowa</option><option value="foot">🚶 Piesza</option><option value="car">🚗 Samochodowa</option></select></label>
  <div class="row"><button id="bFind">ZNAJDŹ MIEJSCE</button><button id="bNav">NAWIGUJ DO…</button></div>
  <div class="row"><button id="bVoice">🎤 Polecenie głosowe</button><button id="bSet">⚙ Ustawienia</button></div>
  <div id="list"></div>
</div>
<div class="panel" id="hud">
  <div id="maneuver">Jedź prosto</div><div id="eta"></div>
  <div class="row"><button id="bVoice2">🎤</button><button id="bMute">Wycisz</button><button class="stop" id="bStop">ZAKOŃCZ</button></div>
</div>

<dialog id="dlg"><h3>Ustawienia</h3>
<label>Dokładność modelu<select id="acc"><option value="mobilenet_v2">Wysoka (wolniejszy)</option><option value="lite_mobilenet_v2">Szybka (mniej dokładny)</option></select></label>
<label>Czułość wykrywania<select id="sens"><option value="0.6">Niska</option><option value="0.5">Średnia</option><option value="0.4">Wysoka</option></select></label>
<label>Alarmy<select id="mode"><option value="both">Dźwięk + głos</option><option value="beep">Tylko dźwięk</option><option value="voice">Tylko głos</option></select></label>
<label>Głośność<input type="range" id="vol" min="0.2" max="1" step="0.1"></label>
<label>Rozpoznawane obiekty</label>
<label><input type="checkbox" data-c="person"> Piesi</label><label><input type="checkbox" data-c="bicycle"> Rowerzyści</label>
<label><input type="checkbox" data-c="car"> Samochody i motocykle</label><label><input type="checkbox" data-c="light"> Sygnalizacja i STOP</label>
<label><input type="checkbox" id="batt"> Tryb oszczędzania baterii (rzadsza analiza)</label>
<label><input type="checkbox" id="night"> Tryb nocny</label>
<label>Język komunikatów<select id="lang"><option value="pl-PL">Polski</option></select></label>
<div class="row"><button id="bHome">Ustaw dom w tym miejscu</button><button id="bClear">Usuń dane</button></div>
<div class="row"><button class="main" onclick="dlg.close()" style="min-height:56px;font-size:18px">Gotowe</button></div>
<p style="font-size:13px;opacity:.8">Zmiana dokładności modelu działa od następnego startu jazdy. BikeGuard wspiera uwagę, nie zastępuje obserwacji drogi. Obraz z kamery jest analizowany tylko na telefonie i nigdzie nie jest zapisywany ani wysyłany.</p></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
(function(){const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#14181b';x.fillRect(0,0,180,180);x.fillStyle='#ffd400';x.font='bold 100px system-ui';x.textAlign='center';x.fillText('BG',90,122);
const u=c.toDataURL('image/png'),l=document.createElement('link');l.rel='apple-touch-icon';l.href=u;document.head.appendChild(l);
const m={name:'BikeGuard',short_name:'BikeGuard',start_url:location.href.split('#')[0],display:'standalone',background_color:'#14181b',theme_color:'#14181b',icons:[{src:u,sizes:'180x180',type:'image/png'}]};
const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(k)})();
const $=id=>document.getElementById(id);
const def={sens:.5,mode:'both',vol:1,batt:false,night:false,prof:'bike',acc:'mobilenet_v2',c:{person:1,bicycle:1,car:1,light:1}};
let S=Object.assign({},def,JSON.parse(localStorage.bg||'{}'));
const save=()=>localStorage.bg=JSON.stringify(S);
let pos=null,muted=false,riding=false,model=null,modelBase='',stream=null,route=null,dest=null,idx=1,said=-1,lastRt=0,wake=null,marker,line,destM,follow=true;
const map=L.map('map',{zoomControl:false}).setView([52.23,21.01],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
map.on('dragstart',()=>{follow=false});
$('bCenter').onclick=()=>{follow=true;if(pos)map.setView(pos,Math.max(map.getZoom(),16))};
function applyUI(){document.body.classList.toggle('night',S.night);$('sens').value=S.sens;$('mode').value=S.mode;$('vol').value=S.vol;$('batt').checked=S.batt;$('night').checked=S.night;$('prof').value=S.prof||'bike';$('acc').value=S.acc||'mobilenet_v2';
document.querySelectorAll('[data-c]').forEach(e=>e.checked=!!S.c[e.dataset.c]);}
applyUI();
$('bSet').onclick=()=>dlg.showModal();
$('prof').onchange=()=>{S.prof=$('prof').value;save();if(dest&&pos)navTo(dest)};
dlg.addEventListener('change',()=>{S.sens=+$('sens').value;S.mode=$('mode').value;S.vol=+$('vol').value;S.batt=$('batt').checked;S.night=$('night').checked;S.acc=$('acc').value;
document.querySelectorAll('[data-c]').forEach(e=>S.c[e.dataset.c]=e.checked?1:0);save();applyUI()});
$('bHome').onclick=()=>{if(pos){localStorage.home=JSON.stringify(pos);say('Zapisano dom')}else say('Brak GPS')};
$('bClear').onclick=()=>{localStorage.clear();S=Object.assign({},def);applyUI();say('Dane usunięte')};
const setP=(id,t,c)=>{const e=$(id);e.textContent=t;e.className='pill '+(c||'')};
let ac;function beep(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=1000;g.gain.value=.4*S.vol;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.12)})}
function say(t,force){if(muted&&!force)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pl-PL';u.volume=S.vol;speechSynthesis.speak(u)}catch(e){}}
function alertUser(t){const w=$('warn');w.textContent=t;w.style.display='block';clearTimeout(w.t);w.t=setTimeout(()=>w.style.display='none',2500);
if(muted)return;if(S.mode!='voice')beep();if(S.mode!='beep')setTimeout(()=>say(t),S.mode=='both'?450:0)}
$('bMute').onclick=$('sMute').onclick=()=>{muted=!muted;$('sMute').textContent=muted?'🔇':'🔊';$('bMute').textContent=muted?'Włącz dźwięk':'Wycisz'};
function gps(){if(!navigator.geolocation)return setP('sGps','GPS: brak','bad');
navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};setP('sGps','GPS: OK','ok');
if(!marker){marker=L.marker(pos,{icon:L.divIcon({html:'<div class="me">🚲</div>',className:'',iconSize:[38,38],iconAnchor:[19,19]})}).addTo(map);map.setView(pos,16)}else marker.setLatLng(pos);
if(follow)map.panTo(pos);if(riding)navTick()},()=>setP('sGps','GPS: brak zgody','bad'),{enableHighAccuracy:true,maximumAge:1000})}
const hav=(a,b)=>{const R=6371e3,r=Math.PI/180,x=(b.lng-a.lng)*r*Math.cos((a.lat+b.lat)/2*r),y=(b.lat-a.lat)*r;return Math.hypot(x,y)*R};
// ---- wizja: śledzenie obiektów między klatkami
const MAP={person:['person','Pieszy na drodze'],bicycle:['bicycle','Uwaga, rowerzysta przed Tobą'],car:['car','Uwaga, samochód'],truck:['car','Uwaga, samochód'],bus:['car','Uwaga, autobus'],motorcycle:['car','Uwaga, motocykl'],'traffic light':['light','Sygnalizacja świetlna'],'stop sign':['light','Znak STOP']};
const lastA={};let tracks=[],tid=0;
const iou=(a,b)=>{const x=Math.max(0,Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0])),y=Math.max(0,Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1])),i=x*y;return i/(a[2]*a[3]+b[2]*b[3]-i)};
async function loop(){if(!riding)return;
try{const v=$('cam'),W=v.videoWidth,H=v.videoHeight;
if(W){const preds=await model.detect(v,12,.3),now=performance.now();
const dets=preds.filter(p=>MAP[p.class]&&S.c[MAP[p.class][0]]&&p.score>=(MAP[p.class][0]=='car'?S.sens-.05:S.sens));
const used=new Set();
for(const d of dets){let b=null,bi=.25;tracks.forEach((t,i)=>{if(used.has(i)||t.cls!=d.class)return;const q=iou(t.box,d.bbox);if(q>bi){bi=q;b=i}});
const f=d.bbox[3]/H;
if(b===null){tracks.push({cls:d.class,box:d.bbox,hist:[[now,f]],hits:1,miss:0});used.add(tracks.length-1)}
else{const t=tracks[b];used.add(b);t.box=d.bbox;t.hits++;t.miss=0;t.hist.push([now,f]);t.hist=t.hist.filter(h=>now-h[0]<1500)}}
tracks.forEach((t,i)=>{if(!used.has(i))t.miss++});tracks=tracks.filter(t=>t.miss<4);
let best=null;
for(const t of tracks){if(t.hits<3||t.miss)continue;
const m=MAP[t.cls],f=t.hist[t.hist.length-1][1],o=t.hist[0],dt=(now-o[0])/1000,g=dt>.4?(f-o[1])/dt:0,cx=(t.box[0]+t.box[2]/2)/W,
inPath=cx>.25&&cx<.75,light=m[0]=='light';let risk=0;
if(!light){if(inPath&&(f>.55||(g>.25&&f>.2)))risk=3;else if(inPath&&f>.3)risk=2;else if(g>.3&&f>.15)risk=1}
else if(f>.25&&t.cls=='stop sign')risk=1;
if(risk&&(!best||risk>best.risk))best={risk,txt:m[1]+(light||inPath?'':(cx<.5?' z lewej strony':' z prawej strony')),k:m[0]}}
if(best){const cd=[0,10000,5000,2000][best.risk];if(!lastA[best.k]||now-lastA[best.k]>cd){lastA[best.k]=now;alertUser(best.risk==3?'Zwolnij, możliwe zagrożenie! '+best.txt:best.txt)}}
setP('sAi','Ostrzeganie: aktywne','ok')}}catch(e){setP('sAi','Ostrzeganie: błąd','bad')}
setTimeout(loop,S.batt?600:120)}
async function start(){riding=true;tracks=[];document.body.classList.add('riding');
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}},audio:false});$('cam').srcObject=stream;setP('sCam','Kamera: OK','ok')}catch(e){setP('sCam','Kamera: brak zgody','bad');alertUser('Brak dostępu do kamery');}
try{wake=await navigator.wakeLock.request('screen')}catch(e){}
if(stream){const base=S.acc||'mobilenet_v2';if(!model||modelBase!=base){setP('sAi','Ostrzeganie: ładuję model…');model=await cocoSsd.load({base});modelBase=base}loop()}
say('Jazda rozpoczęta. Patrz na drogę.')}
function stop(){riding=false;document.body.classList.remove('riding');stream&&stream.getTracks().forEach(t=>t.stop());wake&&wake.release();setP('sCam','Kamera: —');setP('sAi','Ostrzeganie: —');$('warn').style.display='none'}
$('bStart').onclick=start;$('bStop').onclick=stop;
// ---- miejsca
const CAT={spozywcz:['sklep spożywczy','["shop"~"supermarket|convenience|greengrocer"]'],rower:['sklep rowerowy','["shop"="bicycle"]'],stacj:['stacja benzynowa','["amenity"="fuel"]'],apt:['apteka','["amenity"="pharmacy"]'],woda:['miejsce z wodą','["shop"~"supermarket|convenience|kiosk"]'],sklep:['sklep','["shop"]']};
function openNow(oh){if(!oh)return null;if(oh.trim()=='24/7')return true;const D=['Mo','Tu','We','Th','Fr','Sa','Su'],n=new Date(),d=(n.getDay()+6)%7,m=n.getHours()*60+n.getMinutes();let res=null;
for(const part of oh.split(';')){const r=part.trim().match(/^([A-Za-z,\-]+)?\s*(\d\d:\d\d-\d\d:\d\d(?:\s*,\s*\d\d:\d\d-\d\d:\d\d)*)$/);if(!r)return null;
let dm=!r[1];if(r[1])for(const t of r[1].split(',')){const [a,b]=t.split('-'),i=D.indexOf(a),j=b?D.indexOf(b):i;if(i<0||j<0)return null;if(i<=j?d>=i&&d<=j:d>=i||d<=j)dm=true}
if(dm){res=false;for(const s of r[2].split(',')){const [a,b]=s.trim().split('-').map(x=>+x.slice(0,2)*60+ +x.slice(3));if(b>a?m>=a&&m<b:m>=a||m<b)res=true}}}return res}
async function findPlaces(key){if(!pos){say('Brak lokalizacji GPS');return[]}
const [name,q]=CAT[key];$('list').innerHTML='<div class="item">Szukam: '+name+'…</div>';
try{const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(`[out:json][timeout:15];nwr(around:2500,${pos.lat},${pos.lng})${q};out center tags 60;`));
const j=await r.json();const out=j.elements.map(e=>{const c=e.center||e;return{name:e.tags.name||name,lat:c.lat,lng:c.lon,d:hav(pos,{lat:c.lat,lng:c.lon}),open:openNow(e.tags.opening_hours)}}).sort((a,b)=>(b.open===true)-(a.open===true)||a.d-b.d).slice(0,8);
$('list').innerHTML=out.length?'':'<div class="item">Nic nie znaleziono w promieniu 2,5 km.</div>';
out.forEach(p=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<b>${p.name.replace(/</g,'&lt;')}</b><small>${Math.round(p.d)} m · ${p.open===true?'✅ otwarte':p.open===false?'⛔ zamknięte':'❓ godziny niepotwierdzone'}</small>`;d.onclick=()=>navTo(p);$('list').appendChild(d)});return out}
catch(e){$('list').innerHTML='<div class="item">Nie udało się pobrać miejsc (brak internetu lub limit usługi).</div>';return[]}}
function pickCat(t){t=t.toLowerCase();return/rower/.test(t)?'rower':/stacj|paliw|benzyn/.test(t)?'stacj':/apte/.test(t)?'apt':/wod|pić|pic/.test(t)?'woda':/spoż|spoz|jedzen/.test(t)?'spozywcz':'sklep'}
$('bFind').onclick=()=>{$('list').innerHTML='';[['sklep','Najbliższy sklep'],['spozywcz','Sklep spożywczy'],['rower','Sklep rowerowy'],['stacj','Stacja benzynowa'],['apt','Apteka'],['woda','Woda']].forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.style.marginTop='8px';b.onclick=()=>findPlaces(k);$('list').appendChild(b)})};
$('bNav').onclick=()=>{const q=prompt('Dokąd? (adres lub miejsce, np. "Rynek Główny Kraków", albo "dom")');q&&geocode(q)};
async function geocode(q){if(/dom/i.test(q)&&localStorage.home)return navTo(JSON.parse(localStorage.home),'dom');
try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const j=await r.json();if(!j[0])return say('Nie znaleziono celu');navTo({lat:+j[0].lat,lng:+j[0].lon,name:q})}catch(e){say('Błąd wyszukiwania')}}
// ---- nawigacja
const MOD={left:'w lewo','slight left':'lekko w lewo','sharp left':'ostro w lewo',right:'w prawo','slight right':'lekko w prawo','sharp right':'ostro w prawo',straight:'prosto',uturn:'zawróć'};
const instr=s=>{const m=s.maneuver;return m.type=='arrive'?'Jesteś u celu':m.type.includes('roundabout')||m.type=='rotary'?'Wjedź na rondo':'Skręć '+(MOD[m.modifier]||'prosto')};
const PROF={bike:['routed-bike','bike'],foot:['routed-foot','foot'],car:['routed-car','driving']};
async function navTo(p,n){if(!pos)return say('Brak lokalizacji GPS');dest=p;const pf=PROF[S.prof]||PROF.bike;
try{const r=await fetch(`https://routing.openstreetmap.de/${pf[0]}/route/v1/${pf[1]}/${pos.lng},${pos.lat};${p.lng},${p.lat}?overview=full&geometries=geojson&steps=true`);const j=await r.json();if(!j.routes||!j.routes[0])return say('Nie znaleziono trasy');
route=j.routes[0];idx=1;said=-1;line&&line.remove();destM&&destM.remove();
const pts=route.geometry.coordinates.map(c=>[c[1],c[0]]);line=L.polyline(pts,{color:'#0a58ca',weight:7}).addTo(map);destM=L.marker([p.lat,p.lng]).addTo(map);map.fitBounds(line.getBounds());
say('Trasa do '+(p.name||n||'celu')+', '+(route.distance/1000).toFixed(1).replace('.',',')+' kilometra');$('home').style.display='none';document.body.classList.add('riding');if(!riding)start();navTick()}catch(e){say('Błąd wyznaczania trasy')}}
function navTick(){if(!route||!pos)return;const st=route.legs[0].steps;
const pts=route.geometry.coordinates;let md=1e9;for(let i=0;i<pts.length;i+=2)md=Math.min(md,hav(pos,{lat:pts[i][1],lng:pts[i][0]}));
if(md>60&&Date.now()-lastRt>15000){lastRt=Date.now();say('Przeliczam trasę');return navTo(dest)}
while(idx<st.length-1&&hav(pos,{lat:st[idx].maneuver.location[1],lng:st[idx].maneuver.location[0]})<20)idx++;
const s=st[idx],dd=hav(pos,{lat:s.maneuver.location[1],lng:s.maneuver.location[0]});
$('maneuver').textContent=instr(s)+' za '+Math.round(dd)+' m';
let rem=dd;for(let i=idx;i<st.length;i++)rem+=st[i].distance;const sp=route.distance/route.duration;
$('eta').textContent=(rem/1000).toFixed(1)+' km · ok. '+Math.max(1,Math.round(rem/sp/60))+' min · przyjazd '+new Date(Date.now()+rem/sp*1000).toTimeString().slice(0,5);
if(dd<80&&said!==idx){said=idx;say(instr(s)+(dd>30?' za '+Math.round(dd/10)*10+' metrów':''))}}
// ---- polecenia głosowe
function listen(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return say('Rozpoznawanie mowy niedostępne w tej przeglądarce');
const r=new R();r.lang='pl-PL';r.onresult=async e=>{const t=e.results[0][0].transcript.toLowerCase();
if(/dom/.test(t))return geocode('dom');
if(/znajd|zaprowad|prowad/.test(t)&&/dom/.test(t)===false){const o=await findPlaces(pickCat(t));if(o[0]){say('Prowadzę do: '+o[0].name);navTo(o[0])}else say('Nic nie znalazłem')}
else geocode(t.replace(/^(nawiguj|prowadź|zaprowadź mnie)( do)?/,''))};r.start()}
$('bVoice').onclick=$('bVoice2').onclick=listen;
gps();
// ---- ikona aplikacji ze zdjęcia roweru (działa po wgraniu IMG_2053.jpeg na GitHub)
(function(){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d'),W=im.naturalWidth;
x.drawImage(im,W*.076,W*.042,W*.85,W*.85,0,0,180,180);
document.querySelectorAll('link[rel=apple-touch-icon]').forEach(e=>e.remove());
const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)};
im.src='IMG_2053.jpeg'})();
(function(){const d=document.createElement('div');d.id='spd';
d.style.cssText='position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 160px);z-index:5;background:var(--ac);color:#14181b;border-radius:16px;padding:6px 12px;text-align:center;font-weight:800;box-shadow:0 2px 10px #0006;min-width:78px';
d.innerHTML='<div id="spdN" style="font-size:34px;line-height:1">—</div><div style="font-size:13px">km/h</div>';document.body.appendChild(d);
let lp=null,sm=0;
navigator.geolocation&&navigator.geolocation.watchPosition(p=>{let v=p.coords.speed;
if(v==null&&lp){const dt=(p.timestamp-lp.t)/1000;if(dt>0)v=hav(lp,{lat:p.coords.latitude,lng:p.coords.longitude})/dt}
lp={lat:p.coords.latitude,lng:p.coords.longitude,t:p.timestamp};
if(v==null||v<0){document.getElementById('spdN').textContent='—';return}
sm=sm*.6+v*.4;const k=sm*3.6;document.getElementById('spdN').textContent=k<1.5?'0':Math.round(k)},
()=>{},{enableHighAccuracy:true,maximumAge:500})})();

</script></body></html>
